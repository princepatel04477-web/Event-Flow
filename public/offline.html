    <meta name="theme-color" content="#f8f9fa" />
    <title>EventFlow — no connection</title>
    <!--
      Shown by the native shell when the WebView cannot reach the app
      (capacitor.config.ts -> server.errorPath).

      In REMOTE SHELL mode there is no local bundle, so an unreachable server
      previously surfaced Chromium's own "webpage not available" error — grey,
      branded Chrome, with the URL printed on it. That is the most
      browser-looking screen in the product, and it appears at exactly the
      moment staff are least able to reason about it (bad venue Wi-Fi).

      Deliberately self-contained: no external CSS, fonts or images, because
      by definition nothing can be fetched when this renders. That is why the
      EventFlow mark below is an inlined data: URI and not /brand/*.png — a
      <img src="/brand/..."> would be a network fetch on the one screen whose
      entire premise is that the network is gone, and it would render as a
      broken-image icon. The base64 is written by scripts/brand-assets.mjs into
      the element tagged `data-brand-mark`; do not hand-edit it.

      The ground here is the app's paper (#f8f9fa), not the dark teal it used
      to be. A dark screen appearing mid-session in a light app reads as a
      different app having taken over — the opposite of the reassurance this
      page exists to give.
    -->

        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: #f8f9fa;
        color: #191c1d;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      .mark-img {
        width: 88px;
        height: 88px;
        display: block;
        margin: 0 auto 0.75rem;
      }
      .mark {
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin: 0 0 1.5rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1rem;
        opacity: 0.8;

      button {
        margin-top: 0.5rem;
        width: 100%;

        color: #f8f9fa;
        font: inherit;

        cursor: pointer;

      button:active {
        opacity: 0.85;
      }
      .hint {
        margin-top: 1.5rem;
        font-size: 0.8125rem;
        opacity: 0.55;
      }
    </style>
