apply plugin: 'com.android.application'

// Release signing. The keystore and its passwords live OUTSIDE the repo
// (see android/keystore.properties.example); keystore.properties is
// gitignored. The build FAILS LOUDLY when it is missing rather than silently
// falling back to the debug keystore — a debug-signed "release" installs
// happily and then cannot be upgraded by a properly signed build later,
// which means every staff phone has to uninstall and reinstall mid-event.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    // Build output goes outside OneDrive — its NTFS redirector holds locks
    // on intermediate build files even when sync is paused, and Gradle's
    // mergeResources task fails with AccessDeniedException on deletion.
    buildDir = "C:/android-builds/nuvent/debug"
    
    namespace = "com.nuvent.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nuvent.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode must go UP on every distributed APK — it is what the
        // in-app version check compares, and what tells a handset that an
        // install is an upgrade rather than the same build.
        //
        // final-08: v3 look (maroon + marigold, 5 tabs). Web UI still ships from
        // nuvent-five.vercel.app; this build keeps the version check in step.
        //
        // final-07: the navigation rebuild (five tabs for an event lead, a
        // runner's own screens as their bar) and the route collapse. Note that
        // in remote-shell mode NONE of that ships in this APK — it is served
        // from nuvent-five.vercel.app and reached final-06 handsets the moment
        // that deploy landed. This build exists so the version check and the
        // installed base agree; it is not what carries the redesign.
        // final-09: the admin nav fix — every admin page (Hotels, Files and
        // Settings included) is now reachable from the phone's More sheet. In
        // remote-shell mode the fix itself ships from nuvent-five.vercel.app;
        // this bump keeps the version check and the installed base in step.
        versionCode 9
        versionName "final-09"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (!hasKeystore) {
                throw new GradleException(
                    "android/keystore.properties is missing. A release build must be signed " +
                    "with the real key — never the debug keystore. Copy " +
                    "android/keystore.properties.example and fill it in, or restore the " +
                    "keystore from backup. See CLAUDE.md 'Release build'."
                )
            }
            signingConfig signingConfigs.release

            // R8. The keep rules in proguard-rules.pro matter: Capacitor
            // registers plugins by REFLECTION, so anything R8 cannot see a
            // direct reference to gets stripped and the plugin silently does
            // not exist at runtime.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            // Explicit, not inherited. A debuggable release is remotely
            // inspectable on a staff member's phone.
            debuggable false
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
